name: Validate configurations
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bash:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: Exercise native Linux controllers without Azure
        run: python3 ubuntu/verity-tmpfs-root/tests/test_bash.py
      - name: Exercise Azure Linux build wrapper and guest status policy
        run: |
          python3 azure-linux/verity-tmpfs-root/tests/test_build.py
          python3 azure-linux/verity-tmpfs-root/test-cloud-status.py
  scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts, configuration, and certificate profile
        shell: pwsh
        run: .\ubuntu\verity-tmpfs-root\tests\Test-Local.ps1
  producer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.18.1'
      - name: Install producer build prerequisite
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libudev-dev
      - name: Test and build the exact producer revision
        run: |
          git clone https://github.com/vtikoo/encrypt-cloud-image.git producer
          cd producer
          git checkout --detach 5dc3d3f85fdfa6f5bae8bc01edcbf55b2adcfabe
          go test -v .
          go build -trimpath .
